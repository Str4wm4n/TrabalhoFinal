spring.application.name=demo
# devolve a mensagem das regras de negócio (ex.: 409) no JSON de erro
spring.web.error.include-message=always
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# origens do front-end que podem chamar a API pelo navegador (separe por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.datasource.url=jdbc:mysql://localhost:3306/imobiliaria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


#fotos
app.upload-dir=./uploads
spring.servlet.multipart.enabled=true


#email
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=${MAILGUN_USERNAME:}
spring.mail.password=${MAILGUN_PASSWORD:}
app.mail.from=${MAILGUN_FROM:${MAILGUN_USERNAME:}}
spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true